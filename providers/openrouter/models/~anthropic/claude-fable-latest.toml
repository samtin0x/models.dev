# This route maps effort through top-level `verbosity`, not `reasoning.effort`.
# https://openrouter.ai/docs/api/reference/parameters#verbosity (accessed 2026-06-25)
name = "Claude Fable Latest"
description = "Claude model for creative writing, analysis, and controlled agent workflows"
family = "claude-fable"
release_date = "2026-06-09"
last_updated = "2026-06-09"
attachment = true
reasoning = true
temperature = false
tool_call = true
structured_output = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 8
output = 40
cache_read = 0.2
cache_write = 10

[limit]
context = 1_000_000
output = 128_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]
