name: Collect OpenRouter Prices

# Fork-only price collector. Runs the OpenRouter sync hourly and commits any
# pricing movement straight to dev, so the git history accumulates a record of
# what each model cost and which promotions were running when.
#
# Deliberately not the upstream sync-models workflow: that one fans out over
# every provider, needs a GitHub App to sign commits, and routes changes through
# auto-merged PRs. None of that is available on a fork, and none of it is needed
# to build a price history.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: collect-openrouter-prices

jobs:
  collect:
    # Never run on upstream or on forks-of-this-fork.
    if: github.repository == 'samtin0x/models.dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # --no-issues because the runner opens missing-model GitHub issues by
      # default whenever GITHUB_ACTIONS is set, which this fork does not want.
      - name: Sync OpenRouter catalog
        run: bun models:sync openrouter --no-issues
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Validate catalog
        run: bun validate

      - name: Commit price changes
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- models providers)" ]; then
            echo "No pricing changes this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models providers
          git commit -m "chore(prices): OpenRouter $(date -u +'%Y-%m-%d %H:%MZ')"

          # Another run (or a manual push) may have landed first.
          git pull --rebase origin dev
          git push origin HEAD:dev

          {
            echo "## Pricing changes"
            echo
            echo '```'
            git show --stat --format= HEAD
            echo '```'
            echo
            echo "### Models currently discounted"
            echo
            echo '| Model | Discount | Billed in/M | Standard in/M |'
            echo '|---|---|---|---|'
            for f in $(grep -rl '^discount = ' providers/openrouter/models | sort); do
              id="${f#providers/openrouter/models/}"; id="${id%.toml}"
              d=$(sed -n 's/^discount = //p' "$f" | head -1)
              i=$(sed -n 's/^input = //p' "$f" | head -1)
              l=$(sed -n 's/^input_list = //p' "$f" | head -1)
              echo "| \`$id\` | $d | $i | ${l:-—} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # A silent collector is worse than none: the utc_start/utc_end schema drift
      # failed 13 consecutive runs over ~14h before anyone noticed, and promos that
      # start and end inside an outage are lost for good.
      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create collector-failure --color B60205 \
            --description "Price collector run failed" >/dev/null 2>&1 || true

          existing="$(gh issue list --state open --label collector-failure --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing — $RUN_URL"
            exit 0
          fi

          gh issue create \
            --title "Price collector is failing" \
            --label collector-failure \
            --body "$(printf '%s\n' \
              "The OpenRouter price collector failed. Prices are not being recorded, and any promotion that starts and ends before this is fixed will be missing from the history permanently." \
              "" \
              "First failing run: $RUN_URL" \
              "" \
              "Most likely cause is OpenRouter changing a payload shape the Zod schemas reject — check the \`Sync OpenRouter catalog\` step for a ZodError and the offending field path." \
              "" \
              "This issue closes automatically on the next successful run.")"

      - name: Close failure issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --state open --label collector-failure --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered — $RUN_URL"
          done
